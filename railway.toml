[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 2 --timeout-keep-alive 75"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[environments.production.variables]
PYTHON_VERSION = "3.11"
